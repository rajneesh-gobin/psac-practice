<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Page · PSAC Practice</title>
<meta name="theme-color" content="#4f46e5">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<!--
  Deliberately standalone, exactly like guest.html: no Tailwind CDN, no
  supabase-js, no engine/*.js. A child opening this from WhatsApp on a phone
  data plan should download a few KB. This page talks ONLY to
  /api/materials-library.

  ⚠ ONE PERMANENT ADDRESS. The whole reason this page exists is that sharing a
  material used to hand out a signed storage URL that expired in an hour. The
  CODE in this page's URL never changes; the signed URLs are minted fresh by
  the function on every visit. A teacher shares this once, then keeps adding.
-->
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  /* ⚠ Every colour is defined on bare :root first. A token whose only
     definition lives inside a media query has no value in the other theme. */
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#1e2537; --muted:#6b7280; --line:#e6e8ef;
    --soft:#eef0f6; --brand:#4f46e5; --brand-dk:#4338ca; --brand-soft:#eef2ff;
    --ok:#16a34a; --amber:#f59e0b; --shadow:0 1px 2px rgba(16,24,40,.05);
    /* ⚠ Flips with --brand below. A lightened brand in dark mode leaves white
       button text at about 2.6:1, which is not readable on a phone outdoors. */
    --on-brand:#fff;
    --today:#f59e0b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11141c; --card:#181c26; --ink:#e8eaf0; --muted:#9aa3b2; --line:#262b38;
      --soft:#212736; --brand:#8b8bf5; --brand-dk:#a5a5ff; --brand-soft:#1d2033;
      --ok:#4ade80; --amber:#fbbf24; --shadow:0 1px 2px rgba(0,0,0,.4);
      --on-brand:#12141d;
      --today:#fbbf24;
    }
  }
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);
       color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 48px}

  /* ── Header ─────────────────────────────────────────────────────────── */
  .hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:18px;
        padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(79,70,229,.22)}
  .hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
  .hero h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
  .hero .sub{opacity:.92;font-size:13px;margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}

  /* ── The PIN gate ───────────────────────────────────────────────────── */
  .gate{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:18px;box-shadow:var(--shadow)}
  .gate h2{font-size:17px;font-weight:800;letter-spacing:-.005em}
  .gate-help{font-size:13px;color:var(--muted);margin-top:4px}
  .gate label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
  .gate input{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px 14px;
    /* ⚠ 16px minimum. Anything smaller makes iOS Safari zoom the whole page on
       focus, and it never zooms back out. */
    font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
  .gate input:focus{outline:none;border-color:var(--brand)}
  .gate input.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:700}
  .gate-err{margin-top:10px;font-size:13px;font-weight:600;color:#dc2626;min-height:1px}
  .gate-err:empty{display:none}
  .gate button{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:12px;
    background:var(--brand);color:var(--on-brand);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .gate button:disabled{opacity:.6;cursor:default}

  /* ── Homework ───────────────────────────────────────────────────────── */
  .hw{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
      padding:13px;margin-bottom:9px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
  .hw-top{display:flex;align-items:flex-start;gap:10px}
  .hw-ico{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:var(--soft);
          display:grid;place-items:center;font-size:20px}
  .hw-title{font-size:15px;font-weight:700;letter-spacing:-.005em;overflow-wrap:anywhere}
  .hw-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .hw-go{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:10px;
         padding:0 18px;border-radius:11px;background:var(--brand);color:var(--on-brand);
         font-size:14px;font-weight:700}
  .hw.done{opacity:.72}
  .hw.done .hw-go{background:var(--soft);color:var(--muted)}
  .tag.due{background:#fef3c7;color:#92400e}
  .tag.late{background:#fee2e2;color:#991b1b}
  .tag.done{background:#dcfce7;color:#166534}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tag.due{background:#3a2e12;color:#fbbf24}
    :root:not([data-theme="light"]) .tag.late{background:#3a1a1a;color:#fca5a5}
    :root:not([data-theme="light"]) .tag.done{background:#12301e;color:#86efac}
  }

  /* ── Controls ───────────────────────────────────────────────────────── */
  .controls{margin-bottom:12px}
  .views{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);
         border-radius:14px;padding:5px;margin-bottom:10px}
  .view-btn{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);
            font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0 2px}
  .view-btn.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
  .search{position:relative}
  .search input{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px 12px 38px;
    font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--brand)}
  .search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;font-size:14px}
  .sorts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .sorts .lbl{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
  .sort-btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;
            background:var(--card);color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .sort-btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dk)}

  /* ── Cards ──────────────────────────────────────────────────────────── */
  .group{margin-bottom:18px}
  .group-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
  .group-head h2{font-size:14px;font-weight:800;letter-spacing:-.005em}
  .group-head .n{font-size:12px;color:var(--muted);font-weight:600}
  .card{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--card);
        border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;box-shadow:var(--shadow)}
  .card-ico{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}
  .card-title{font-size:15px;font-weight:700;letter-spacing:-.005em;overflow-wrap:anywhere}
  .card-sub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .tag{background:var(--soft);color:var(--muted);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600}
  .tag.subj{background:var(--brand-soft);color:var(--brand-dk)}
  .open{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:10px;
        padding:0 18px;border-radius:11px;background:var(--brand);color:var(--on-brand);text-decoration:none;
        font-size:14px;font-weight:700}
  .open:active{background:var(--brand-dk)}
  .dead{margin-top:10px;font-size:12.5px;color:var(--amber);font-weight:600}

  /* ── Calendar ───────────────────────────────────────────────────────── */
  .cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .cal-head strong{font-size:15px;font-weight:800}
  .cal-nav{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:11px;
           background:var(--card);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
  .cal-nav:disabled{opacity:.35;cursor:default}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
  .cal-dow span{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  /* ⚠ NOT aspect-ratio. Seven columns inside a 360px phone leave 41px per
     cell, and a 41px square is a tap target under the 44px floor — measured,
     not eyeballed. The width belongs to the grid, so the height is what can
     be given back. */
  .cal-cell{position:relative;min-height:44px;border:0;border-radius:10px;background:transparent;
            color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:default;padding:0}
  .cal-cell.pad{visibility:hidden}
  .cal-cell.today{outline:2px solid var(--today);outline-offset:-2px;color:var(--ink)}
  .cal-cell.has{background:var(--brand-soft);color:var(--brand-dk);font-weight:800;cursor:pointer}
  .cal-cell.has.sel{background:var(--brand);color:var(--on-brand)}
  .cal-cell .dot{position:absolute;left:50%;transform:translateX(-50%);bottom:5px;width:5px;height:5px;
                 border-radius:50%;background:currentColor;opacity:.7}
  .cal-legend{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
  .cal-day{margin-top:14px}
  .cal-day h3{font-size:13px;font-weight:800;color:var(--muted);margin:0 2px 8px}

  /* ── States ─────────────────────────────────────────────────────────── */
  .state{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;
         text-align:center;box-shadow:var(--shadow)}
  .state .big{font-size:34px;line-height:1}
  .state h2{font-size:17px;font-weight:800;margin:10px 0 6px}
  .state p{font-size:14px;color:var(--muted)}
  .foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
  .foot a{color:var(--brand-dk)}
  .skel{height:70px;border-radius:14px;background:var(--card);border:1px solid var(--line);
        margin-bottom:9px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero" id="hero">
    <div class="eyebrow">Class page</div>
    <h1 id="cls-name">Loading…</h1>
    <div class="sub" id="cls-sub">Everything your teacher has shared, in one place.</div>
    <div class="chips" id="cls-chips"></div>
  </header>

  <!-- ⚠ THE PIN IS THE GATE, NOT THE CODE. Which of the two fields shows is
       decided by the classroom's own access_type, fetched with info:true before
       anything behind the gate is asked for. -->
  <section class="gate hidden" id="gate">
    <h2 id="gate-title">Sign in to see your class</h2>
    <p class="gate-help" id="gate-help"></p>
    <label for="g-name" id="g-name-label">Your name</label>
    <input type="text" id="g-name" maxlength="40" autocomplete="given-name" placeholder="e.g. Sam B">
    <label for="g-pin" id="g-pin-label">PIN</label>
    <input type="tel" id="g-pin" inputmode="numeric" maxlength="4" class="pin" placeholder="0000"
           autocomplete="off" aria-describedby="gate-err">
    <p class="gate-err" id="gate-err" role="alert" aria-live="polite"></p>
    <button type="button" id="g-go">See my class →</button>
  </section>

  <div class="controls hidden" id="controls">
    <div class="views" role="tablist" aria-label="How to view the materials">
      <button type="button" class="view-btn on" data-view="work"    role="tab" aria-selected="true">📝 Homework</button>
      <button type="button" class="view-btn"    data-view="list"    role="tab" aria-selected="false">📋 Files</button>
      <button type="button" class="view-btn"    data-view="subject" role="tab" aria-selected="false">📚 Subject</button>
      <button type="button" class="view-btn"    data-view="calendar" role="tab" aria-selected="false">🗓️ Calendar</button>
    </div>
    <div class="search">
      <span class="ico" aria-hidden="true">🔍</span>
      <input type="search" id="q" placeholder="Search by name or subject" aria-label="Search the library">
    </div>
    <div class="sorts hidden" id="sorts" role="group" aria-label="Sort">
      <span class="lbl">Sort</span>
      <button type="button" class="sort-btn on" data-sort="recent">🕑 Newest first</button>
      <button type="button" class="sort-btn"    data-sort="oldest">📆 Oldest first</button>
      <button type="button" class="sort-btn"    data-sort="title">🔤 Name</button>
    </div>
  </div>

  <main id="out" aria-live="polite">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </main>

  <p class="foot" id="foot"></p>
</div>
<script src="/materials.js"></script>
</body>
</html>
