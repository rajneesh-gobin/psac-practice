<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help me answer! · PSAC Practice</title>
<meta name="theme-color" content="#4f46e5">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<!--
  The "Ask the Crowd" voting page for the Peak Quest minigame. Deliberately
  standalone, same reason as guest.html: someone tapping a WhatsApp link on a
  phone data plan should download a few KB, not the whole app.

  It talks straight to PostgREST with the PUBLISHABLE key (the same one shipped
  in engine/supabase.js) - minigame_poll_results and minigame_poll_vote are
  granted to anon and hold no secrets: the poll row never contains the answer.

  One vote per browser is a localStorage courtesy, not a security boundary; the
  server caps a poll at 500 votes and 3 minutes either way.
-->
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;
       background:linear-gradient(160deg,#312e81,#4f46e5 55%,#7c3aed);min-height:100vh;
       color:#1e2537;-webkit-text-size-adjust:100%;padding:18px 14px 40px}
  .wrap{max-width:520px;margin:0 auto}
  .top{color:#fff;text-align:center;margin-bottom:14px}
  .top .peak{font-size:44px;line-height:1}
  .top h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
  .top p{opacity:.85;font-size:13px;margin-top:2px}
  .card{background:#fff;border-radius:20px;padding:20px 16px;box-shadow:0 12px 34px rgba(15,23,42,.35)}
  .q{font-size:17px;font-weight:700;margin-bottom:14px}
  .q img,.q svg{max-width:100%;height:auto}
  .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid #e6e8ef;
       background:#f8fafc;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;
       margin-bottom:10px;cursor:pointer;transition:transform .12s,border-color .12s;color:#1e2537}
  .opt:active{transform:scale(.98)}
  .opt:hover{border-color:#818cf8}
  .opt .tag{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#eef2ff;color:#4f46e5;
       display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .opt[disabled]{opacity:.55;cursor:default}
  .bar-row{margin-bottom:10px}
  .bar-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:3px}
  .bar-track{background:#eef1f6;border-radius:99px;height:14px;overflow:hidden}
  .bar-fill{height:14px;border-radius:99px;background:linear-gradient(90deg,#818cf8,#4f46e5);
       width:0%;transition:width .6s ease}
  .bar-row.mine .bar-fill{background:linear-gradient(90deg,#34d399,#059669)}
  .muted{color:#6b7280;font-size:13px}
  .center{text-align:center}
  .pill{display:inline-block;background:#eef2ff;color:#4338ca;font-weight:700;font-size:12px;
       border-radius:99px;padding:4px 12px;margin-bottom:10px}
  .big{font-size:42px;line-height:1;margin-bottom:6px}
  .hide{display:none}
  .foot{text-align:center;margin-top:16px;color:#fff;opacity:.75;font-size:12px}
  .foot a{color:#fff;font-weight:700}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .45s ease}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="peak">🏔️</div>
    <h1>Help me climb the peak!</h1>
    <p>A student needs your vote on this question</p>
  </div>

  <div class="card" id="card">
    <p class="muted center" id="status">Loading the question…</p>
    <div id="ask" class="hide">
      <div class="pill" id="timer">⏳</div>
      <div class="q" id="q"></div>
      <div id="opts"></div>
      <p class="muted center">Tap the answer you think is right — you get one vote!</p>
    </div>
    <div id="done" class="hide">
      <div class="center pop"><div class="big" id="done-icon">🗳️</div>
        <p style="font-weight:800;font-size:17px;margin-bottom:2px" id="done-title">Vote counted!</p>
        <p class="muted" id="done-sub">Here's what the crowd thinks so far:</p></div>
      <div id="bars" style="margin-top:14px"></div>
      <p class="muted center" id="done-timer"></p>
    </div>
  </div>

  <p class="foot">Powered by <a href="/">PSAC Exam Practice</a> — free revision for Mauritian students</p>
</div>

<script>
'use strict';
const SB_URL = 'https://xawvjwsiqhtxgpocdqgm.supabase.co';
const SB_KEY = 'sb_publishable_wERRrZnvoWhM5faN2AaYpQ_CpTNHFkL';
const LETTERS = ['A','B','C','D'];

const code = (location.pathname.match(/\/v\/([A-Za-z0-9]{4,16})/) || [])[1]
          || new URLSearchParams(location.search).get('code') || '';
const $ = id => document.getElementById(id);
const votedKey = 'psac_vote_' + code;

async function rpc(fn, body) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

let poll = null, myVote = null, ticking = null;

function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function drawBars() {
  const total = poll.votes.reduce((a, b) => a + b, 0);
  $('bars').innerHTML = poll.options.map((o, i) => {
    const n = poll.votes[i] || 0;
    const pct = total ? Math.round(n / total * 100) : 0;
    return `<div class="bar-row${i === myVote ? ' mine' : ''}">
      <div class="bar-head"><span>${LETTERS[i]}. ${o}</span><span>${n} vote${n === 1 ? '' : 's'} · ${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  $('done-timer').textContent = poll.seconds_left > 0
    ? 'Live — updates as more people vote. ' + fmt(poll.seconds_left) + ' left.'
    : 'Voting has closed. Thanks for helping!';
}

function showDone() {
  $('ask').classList.add('hide');
  $('status').classList.add('hide');
  $('done').classList.remove('hide');
  drawBars();
  clearInterval(ticking);
  // Keep the bars honest while the poll is open, then stop - a closed poll
  // never changes again and hammering the API for it helps nobody.
  ticking = setInterval(async () => {
    try {
      const r = await rpc('minigame_poll_results', { p_code: code });
      if (r.ok) { poll = r; drawBars(); }
      if (!r.ok || r.seconds_left <= 0) clearInterval(ticking);
    } catch (_) {}
  }, 3000);
}

async function vote(i) {
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  try {
    const r = await rpc('minigame_poll_vote', { p_code: code, p_option: i });
    if (r.ok) {
      myVote = i;
      poll.votes = r.votes;
      try { localStorage.setItem(votedKey, String(i)); } catch (_) {}
      showDone();
    } else if (r.error === 'closed') {
      $('done-icon').textContent = '⏰'; $('done-title').textContent = 'Just missed it!';
      $('done-sub').textContent = 'Voting closed moments ago. Final results:';
      showDone();
    } else {
      $('status').textContent = 'Could not record the vote. Please try again.';
      $('status').classList.remove('hide');
      document.querySelectorAll('.opt').forEach(b => b.disabled = false);
    }
  } catch (_) {
    $('status').textContent = 'No connection — check your internet and try again.';
    $('status').classList.remove('hide');
    document.querySelectorAll('.opt').forEach(b => b.disabled = false);
  }
}

(async () => {
  if (!code) { $('status').textContent = 'This voting link is incomplete. Ask for a fresh one!'; return; }
  let r;
  try { r = await rpc('minigame_poll_results', { p_code: code }); }
  catch (_) { $('status').textContent = 'No connection — check your internet and try again.'; return; }
  if (!r.ok) { $('status').textContent = 'This poll has finished and been tidied away. Ask for a fresh link!'; return; }
  poll = r;

  const prior = (() => { try { return localStorage.getItem(votedKey); } catch (_) { return null; } })();
  if (prior !== null) {
    myVote = parseInt(prior, 10);
    $('done-title').textContent = 'You already voted!';
    $('done-sub').textContent = 'Here’s what the crowd thinks:';
    showDone();
    return;
  }
  if (poll.seconds_left <= 0) {
    $('done-icon').textContent = '⏰'; $('done-title').textContent = 'Voting has closed';
    $('done-sub').textContent = 'Final results:';
    showDone();
    return;
  }

  $('q').innerHTML = poll.question;
  $('opts').innerHTML = poll.options.map((o, i) =>
    `<button class="opt" onclick="vote(${i})"><span class="tag">${LETTERS[i]}</span><span>${o}</span></button>`).join('');
  $('status').classList.add('hide');
  $('ask').classList.remove('hide');

  let left = poll.seconds_left;
  $('timer').textContent = '⏳ ' + fmt(left);
  ticking = setInterval(() => {
    left--;
    if (left <= 0) {
      clearInterval(ticking);
      $('done-icon').textContent = '⏰'; $('done-title').textContent = 'Voting has closed';
      $('done-sub').textContent = 'Final results:';
      rpc('minigame_poll_results', { p_code: code }).then(x => { if (x.ok) poll = x; showDone(); }).catch(() => showDone());
      return;
    }
    $('timer').textContent = '⏳ ' + fmt(left);
  }, 1000);
})();
</script>
</body>
</html>
