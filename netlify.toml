  to     = "/.netlify/functions/admin-member-emails"
  status = 200

[[redirects]]
  from   = "/api/admin-teacher-activity"
  to     = "/.netlify/functions/admin-teacher-activity"
  status = 200

# ── Guest assignment mode ────────────────────────────────────────────────
# /a/<CODE> serves the lightweight guest page. status 200 = rewrite, so the
# URL the child received on WhatsApp stays in the address bar and guest.js can
# read the code from location.pathname.
[[redirects]]
  from   = "/a/*"
  to     = "/guest.html"
  status = 200

# /m/<CODE> serves the classroom material library. Same rewrite trick as /a/:
# the shared URL stays in the address bar and materials.js reads the code from
# location.pathname.
#
# ⚠ This link is PERMANENT and that is the feature. Sharing one material used
# to hand out a signed storage URL that expired in an hour; the code here never
# changes and the signed URLs are minted per visit by the function.
[[redirects]]
  from   = "/m/*"
  to     = "/materials.html"
  status = 200
# /v/<CODE> serves the standalone Ask-the-Crowd voting page (minigame
# lifeline). Same rewrite trick as /a/: the shared URL stays in the address
# bar and vote.html reads the code from location.pathname.
[[redirects]]
  from   = "/v/*"
  to     = "/vote.html"
  status = 200

[[redirects]]
  from   = "/api/parent-pin-signin"
  to     = "/.netlify/functions/parent-pin-signin"
  status = 200

[[redirects]]
  from   = "/api/assignment-open"
  to     = "/.netlify/functions/assignment-open"
  status = 200

[[redirects]]
  from   = "/api/assignment-submit"
  to     = "/.netlify/functions/assignment-submit"
  status = 200

[[redirects]]
  from   = "/api/classroom-materials"
  to     = "/.netlify/functions/classroom-materials"
  status = 200

# A pupil ticking a PDF or video as done. The RPC re-checks the PIN token.
[[redirects]]
  from   = "/api/material-done"
  to     = "/.netlify/functions/material-done"
  status = 200

# A pupil correcting their own name. Per-pupil-PIN classrooms only.
[[redirects]]
  from   = "/api/pupil-name"
  to     = "/.netlify/functions/pupil-name"
  status = 200

# The classroom material library behind /m/<CODE>. Mints fresh signed URLs on
# every request, so it must never be cached - the function sends no-store.
[[redirects]]
  from   = "/api/materials-library"
  to     = "/.netlify/functions/materials-library"
  status = 200

# A shared-PIN device registering the name it is being used under.
[[redirects]]
  from   = "/api/guest-device"
  to     = "/.netlify/functions/guest-device"
  status = 200

# The public contact form. Anon has no table grant; the function holds the
# service role and throttles by itself.
[[redirects]]
  from   = "/api/contact-message"
  to     = "/.netlify/functions/contact-message"
  status = 200
