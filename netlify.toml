[build]
  command   = "node netlify/build-questions.js"
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

# The question files are DATA read at runtime by the vm sandbox
# (netlify/lib/questions-sandbox.js), not imports esbuild can follow. Without
# included_files they are absent from the bundle and every re-grade returns 0.
#
# Scoped per-function on purpose: subjects/ is ~2.5 MB across 147 files, and a
# global [functions] included_files would ship all of it inside push-send,
# notify, weekly-digest and every other function that never reads a question.
# ⚠ question-bundles/** is why this function is fast or slow, and it was MISSING.
# build-questions.js writes netlify/question-bundles/*.json at deploy time, and
# questions.js reads them with fs.readFileSync. esbuild only traces require()
# and import — a runtime path is invisible to it — and the directory is
# gitignored, so nothing else would ever pull it in. Without this line
# fs.existsSync() was false in production and EVERY request fell through to the
# vm fallback: read ~30 question source files, execute them in a sandbox, per
# call. Measured TTFB was ~0.95 s for one subject.
#
# subjects/** stays as the fallback's safety net, for a deploy where the build
# step produced no bundles.
[functions."questions"]
  included_files = ["subjects/**/*.js", "netlify/question-bundles/**"]

[functions."assignment-open"]
  included_files = ["subjects/**/*.js"]

[functions."assignment-submit"]
  included_files = ["subjects/**/*.js"]

[functions."classroom-materials"]

# ── Security headers ──────────────────────────────────────────────────────────
# Cache headers
# ⚠ Netlify's default is `public,max-age=0,must-revalidate` on EVERYTHING
#   (measured against production 2026-09-08, not assumed). That is correct for
#   the engine and index.html, which must never be stale — but it also means
#   every other file is revalidated on every load, and a 304 with no body is
#   still a billed web request.
#
# ⚠ Only files whose NAME identifies their content get a long max-age.
#   Deliberately NOT listed: engine/*.js, index.html, style.css, sw.js. A stale
#   engine file is how a fix stops reaching people, and the service worker
#   already serves those from its own cache — a browser cache in front of it
#   buys nothing and can only get in the way.
#
# ⚠ 30 days, and no `immutable`. The rule is that a replacement question image
#   gets a NEW filename, but that is a convention this file cannot enforce, and
#   a file replaced in place would otherwise be pinned on every device for the
#   whole period with no way to reach it.
[[headers]]
  for = "/assets/questions/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains"
    # script-src must allow cdn.jsdelivr.net: index.html loads @supabase/supabase-js
    # from there (the UMD build), and without it the browser blocks the script
    # entirely — window.supabase stays undefined and the whole app fails (no
    # client, no auth, no DB calls). Verified this was missing pre-launch: the
    # CSP would have broken the very first real deploy.
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self' https://*.supabase.co https://accounts.google.com; img-src 'self' data: https:; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'"

[functions."weekly-digest"]
  schedule = "0 9 * * 0"

# ⚠ SCHEDULE DELIBERATELY OFF. Every 15 minutes is 2,880 invocations a month,
# each one querying Supabase, and push_subscriptions is EMPTY — nobody has ever
# granted notification permission, so every single run sent nothing.
#
# Re-enable the moment there is a real subscriber:
#   SELECT count(*) FROM push_subscriptions;
# then uncomment the line below. The 15-minute cadence is not arbitrary —
# reminder_time is stored as "HH:MM" and push-reminders.js matches a window
# around now, so a coarser schedule would silently skip people's chosen times.
[functions."push-reminders"]
# schedule = "*/15 * * * *"

[functions."assignment-cleanup"]
  schedule = "17 2 * * *"

[functions."classroom-purge"]
  schedule = "@daily"


# ── Block source docs and SQL from the public site ────────────────────────
# publish = "." serves the ENTIRE repo root, so every file here was reachable.
# Verified live on 2026-08-30: /supabase-schema.sql returned 200 with the full
# text of every RLS policy in the system, and /CLAUDE.md returned 200 with the
# architecture notes — including where enforcement lives and what is known-weak.
# Neither contains a credential, but together they are a map for an attacker.
#
# ⚠ Listed one by one because Netlify wildcards only match a TRAILING splat —
# "/*.md" does not work, so a pattern rule would silently match nothing and
# leave everything exposed. Add a line here whenever a doc or .sql is added at
# the root; the check is:
#   curl -o /dev/null -w '%{http_code}' https://<site>/CLAUDE.md   -> expect 404
#
# ⚠ 2026-09-06: the 31 incremental supabase-*.sql migrations, plus guest.sql and
# report_error.sql, were consolidated into the single supabase-schema.sql and
# deleted, and their 18 redirect rules went with them. THERE IS NOW EXACTLY ONE
# .sql FILE AT THE ROOT and it is blocked below.
#
# ⚠ Four of those files had NO rule and production was serving them 200 with the
# full text of their RLS policies and RPC bodies — measured, not assumed:
# /guest.sql, /report_error.sql, /supabase-geo-map.sql, /supabase-minigame-crowd.sql.
# Deleting them is what fixes that, and only once a deploy actually goes out.
# That is the standing argument for the line below: a per-file allowlist fails
# open every single time someone forgets, and someone always forgets.
#
# The longer-term fix is to publish an assembled directory containing only the
# app, rather than the repo root.

# ⚠ A CLI deploy uploads from LOCAL DISK, not git, so being gitignored is not
# enough — .import-conflicts/ ships if it exists. It holds the DATABASE version
# of every protected question the importer could not sync back to source, with
# correct answers in it. This is a TRAILING splat, which is the one wildcard
# shape Netlify actually matches.
[[redirects]]
  from   = "/.import-conflicts/*"
  to     = "/"
  status = 404
  force  = true

# ⚠⚠ MEASURED AGAINST PRODUCTION 2026-09-08: the WHOLE netlify/ directory was
# being served, and every one of these answered 200 to an anonymous request.
#   /netlify/question-bundles/grade5-maths.json   200, 651 KB of real questions
#                                                 WITH THEIR ANSWERS
#   /netlify/functions/questions.js               200, 36 KB - the source of the
#                                                 entitlement enforcement itself
#   /netlify/lib/questions-sandbox.js             200
#   /netlify/import-questions.js                  200
# 58 bundle files in all. That path bypasses netlify/functions/questions.js
# entirely - the plan, the kill switch, entitlements, expiry and moderation
# blocks are all decided in that function, and none of them ran. The bundles are
# gitignored, which is exactly the trap the note above describes: a CLI deploy
# uploads from LOCAL DISK, so being gitignored ships them rather than excluding
# them. publish = "." then serves the repo root.
#
# ⚠ This does NOT touch "/.netlify/functions/*" - a different first path segment
#   (leading dot). Verified before this rule: the function answered 401 while its
#   SOURCE answered 200. Re-verify BOTH after the next deploy: the function must
#   still answer 401 and /netlify/question-bundles/*.json must answer 404.
# ⚠ Nothing in the browser fetches this path - grepped across engine/, index.html,
#   guest.html, vote.html and score.html before blocking it.
[[redirects]]
  from   = "/netlify/*"
  to     = "/"
  status = 404
  force  = true

# ⚠ MEASURED 2026-09-08. Two different 404 bodies come back from production and
# they mean opposite things - this is how to read a probe of this site:
#   404 with ~398 KB  = one of THESE rules fired (the SPA shell served at 404).
#   404 with ~4.2 KB  = Netlify's own "not found": the file simply was not in
#                       that deploy. It is NOT blocked, and it WILL be served the
#                       first time a deploy happens to contain it.
# Everything below returned the 4.2 KB shape, i.e. unblocked and merely absent,
# except /docs/* which was live at 200.

# Internal planning and analysis. /docs/content-coverage-plan.md was answering
# 200 with 8.8 KB to anyone.
[[redirects]]
  from   = "/docs/*"
  to     = "/"
  status = 404
  force  = true

# ⚠ REAL EXAM PAPERS, and the reason this one matters most: these are PDFs of
# copyrighted MES/MIE papers kept as SOURCE MATERIAL for analysis. Serving them
# is redistribution of whole copyrighted papers, which is exactly what the
# content brief forbids. Not blocked before; absent from the last deploy only
# by luck, and a CLI deploy uploads from local disk.
[[redirects]]
  from   = "/past-papers/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/exam_papers/*"
  to     = "/"
  status = 404
  force  = true

# SQL. The schema itself is already blocked as /supabase-schema.sql.
[[redirects]]
  from   = "/migrations/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/tmp/*"
  to     = "/"
  status = 404
  force  = true

# Netlify normally excludes this, but "normally" is not a guarantee worth
# resting a publish root on.
[[redirects]]
  from   = "/node_modules/*"
  to     = "/"
  status = 404
  force  = true

# ⚠ Scratch files that live in the repo ROOT. Five of them are tracked in git.
# A partial-segment splat like "/dbg*" is not a shape Netlify matches, so each
# needs its own exact rule - and that is precisely why the whole list goes stale.
# scripts/test-netlify-redirects.js walks the tree and fails on anything that is
# neither allowlisted nor blocked, so the next one cannot ship unnoticed.
[[redirects]]
  from   = "/dbg18.js"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/dbg23.js"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/dbg25.js"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/dbg27.js"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/test.py"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/ext-images-result.json"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/floor-check-report.json"
  to     = "/"
  status = 404
  force  = true

# ⚠ DOT-DIRECTORIES. Netlify excludes .git, and nothing else is promised. The
# precedent for treating these as servable is the /.import-conflicts/* rule
# above, which a previous session added deliberately; whether Netlify serves an
# arbitrary dot-directory has NOT been re-measured here, so these are blocks
# taken on the safe side rather than a confirmed leak. A leading or
# partial-segment splat ("/.*") is not a shape Netlify matches, so each is
# named. scripts/test-netlify-redirects.js fails when a new one appears -
# a developer on a different editor will hit that and add a line, which is the
# intended cost.
#   .netlify/       Netlify CLI state, including the site id
#   .claude/        agent settings (settings.local.json)
#   .idea/          JetBrains project config, carries absolute local paths
#   .github/        workflows
#   .imgshots/      screenshots from the layout harnesses

[[redirects]]
  from   = "/.netlify-state/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/.claude/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/.idea/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/.github/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/.imgshots/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/.vscode/*"
  to     = "/"
  status = 404
  force  = true

# ⚠⚠ CAUGHT BY scripts/test-netlify-redirects.js ON A REAL CHANGE, not a
# planted one. A 31 MB `.deploy/` directory appeared in the publish root - an
# assembled copy of the app, which is the "publish only the app" fix the note
# at the top of this file recommends. It is gitignored, and a CLI deploy
# uploads from local disk, so it ships.
#
# ⚠ IT CARRIES `.deploy/subjects/*/questions/` - the question SOURCE files,
# with their answers. The rule that blocks those is `/subjects/*/questions/*`,
# which does NOT match a path beginning `/.deploy/`, so shipping this
# directory would republish every question at a second URL and step straight
# around the existing block. Exactly the shape of the netlify/question-bundles
# leak, and it was introduced minutes before this rule.
#
# ⚠ Blocking it does not conflict with using it: `netlify deploy --dir=.deploy`
# names the directory explicitly and does not go through these redirects. This
# rule only stops it being served as a subdirectory of the CURRENT publish
# root, which is `publish = "."`.
[[redirects]]
  from   = "/.deploy/*"
  to     = "/"
  status = 404
  force  = true

