[build]
  command   = "node netlify/build-questions.js"
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

# The question files are DATA read at runtime by the vm sandbox
# (netlify/lib/questions-sandbox.js), not imports esbuild can follow. Without
# included_files they are absent from the bundle and every re-grade returns 0.
#
# Scoped per-function on purpose: subjects/ is ~2.5 MB across 147 files, and a
# global [functions] included_files would ship all of it inside push-send,
# notify, weekly-digest and every other function that never reads a question.
# ⚠ question-bundles/** is why this function is fast or slow, and it was MISSING.
# build-questions.js writes netlify/question-bundles/*.json at deploy time, and
# questions.js reads them with fs.readFileSync. esbuild only traces require()
# and import — a runtime path is invisible to it — and the directory is
# gitignored, so nothing else would ever pull it in. Without this line
# fs.existsSync() was false in production and EVERY request fell through to the
# vm fallback: read ~30 question source files, execute them in a sandbox, per
# call. Measured TTFB was ~0.95 s for one subject.
#
# subjects/** stays as the fallback's safety net, for a deploy where the build
# step produced no bundles.
[functions."questions"]
  included_files = ["subjects/**", "netlify/question-bundles/**"]

[functions."assignment-open"]
  included_files = ["subjects/**"]

[functions."assignment-submit"]
  included_files = ["subjects/**"]

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains"
    # script-src must allow cdn.jsdelivr.net: index.html loads @supabase/supabase-js
    # from there (the UMD build), and without it the browser blocks the script
    # entirely — window.supabase stays undefined and the whole app fails (no
    # client, no auth, no DB calls). Verified this was missing pre-launch: the
    # CSP would have broken the very first real deploy.
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self' https://*.supabase.co https://accounts.google.com; img-src 'self' data: https:; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'"

[functions."weekly-digest"]
  schedule = "0 9 * * 0"

# ⚠ SCHEDULE DELIBERATELY OFF. Every 15 minutes is 2,880 invocations a month,
# each one querying Supabase, and push_subscriptions is EMPTY — nobody has ever
# granted notification permission, so every single run sent nothing.
#
# Re-enable the moment there is a real subscriber:
#   SELECT count(*) FROM push_subscriptions;
# then uncomment the line below. The 15-minute cadence is not arbitrary —
# reminder_time is stored as "HH:MM" and push-reminders.js matches a window
# around now, so a coarser schedule would silently skip people's chosen times.
[functions."push-reminders"]
# schedule = "*/15 * * * *"

[functions."assignment-cleanup"]
  schedule = "17 2 * * *"

# ── Block direct browser access to question source files ──────────────
# The /subjects/*/questions/* path is served by the Netlify Function instead.
# These redirects only apply to Netlify hosting, not local file:// access.
[[redirects]]
  from   = "/subjects/*/questions/*"
  to     = "/"
  status = 404
  force  = true

# Route API calls to functions
[[redirects]]
  from   = "/api/questions"
  to     = "/.netlify/functions/questions"
  status = 200

# NOTE: /api/student-login and /api/set-pin were removed. Student PIN
# verification and PIN setting are handled entirely by the Supabase RPCs
# verify_student_pin() and set_student_pin() (bcrypt, inside the database),
# which cost no function invocations. The scrypt-based Netlify functions that
# used to back these routes were dead code and have been deleted.

[[redirects]]
  from   = "/api/create-user"
  to     = "/.netlify/functions/create-user"
  status = 200

# ── Guest assignment mode ────────────────────────────────────────────────
# /a/<CODE> serves the lightweight guest page. status 200 = rewrite, so the
# URL the child received on WhatsApp stays in the address bar and guest.js can
# read the code from location.pathname.
[[redirects]]
  from   = "/a/*"
  to     = "/guest.html"
  status = 200

[[redirects]]
  from   = "/api/assignment-open"
  to     = "/.netlify/functions/assignment-open"
  status = 200

[[redirects]]
  from   = "/api/assignment-submit"
  to     = "/.netlify/functions/assignment-submit"
  status = 200
