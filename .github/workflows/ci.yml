name: CI

# The project has no build step, so nothing catches a typo before it reaches
# production. These checks are the cheap substitute: syntax-check every file,
# then run the static reference checks that would have caught the real bugs
# this codebase has actually shipped.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Parse every JS file. Catches unclosed braces, stray characters and the
      # sort of thing that only shows up as a blank screen otherwise.
      - name: Syntax-check all JavaScript
        run: |
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" >/dev/null 2>&1; then
              echo "::error file=$f::syntax error"
              node --check "$f" || true
              fail=1
            fi
          done < <(find engine netlify scripts subjects -name '*.js' -not -path '*/node_modules/*' 2>/dev/null; ls guest.js sw.js 2>/dev/null)
          exit $fail

      # Undefined handlers, drifted file lists, missing pre-cache entries,
      # duplicate badge ids, and the pgcrypto search_path trap.
      - name: Static reference checks
        run: node scripts/check.js

      # A secret in the repo is worth failing the build over.
      # The error boundary is the only thing standing between a top-level
      # throw and a permanently blank page. Its decision logic is easy to
      # break in a way nothing else would notice.
      - name: Error-boundary behaviour
        run: node scripts/test-error-boundary.js
      # Renders the co-parent settings card against stubbed responses. The
      # case that matters is F: a failed request must not render as "just you".
      - name: Co-parent settings UI
        run: node scripts/test-coparent-ui.js

      # ⚠ The landing page is invisible to a crawler the moment one word comes
      #   back: re-adding "hidden" to #screen-landing is the natural thing to do
      #   while tidying screens, costs nothing visible in the app (Auth.init()
      #   un-hides it a moment later) and shows up weeks later as traffic that
      #   never arrived. Also runs the inline boot-state script for real.
      - name: Landing page readable without JavaScript
        run: node scripts/test-landing-no-js.js
      # Six surfaces state the coverage range; the meta description is the one a
      # parent reads BEFORE they ever reach the site.
      # ⚠ The per-subject landing pages are the most PUBLIC thing here — a
      #   stranger's first impression, cached by Google far longer than it can be
      #   corrected. This fails if they have drifted from the packs, if one has
      #   grown a <script src> (and stopped being renderable by a crawler), if the
      #   prose has gone templated (Google penalises doorway pages at the DOMAIN
      #   level), or if a held grade has been published.
      # The bank is the risk: the game DOCKS a child for tapping a word it left
      # unflagged, so a structural slip there punishes a child for being right.
      - name: French Ninja
        run: node scripts/test-french-ninja.js
      - name: Subject landing pages
        run: node scripts/test-subject-pages.js
      - name: Share-copy parity
        run: node scripts/test-share-copy-parity.js

      - name: Scan for committed credentials
        run: |
          fail=0
          # Supabase personal access token
          if grep -rEn 'sbp_[a-f0-9]{40}' --include='*.js' --include='*.json' --include='*.md' --include='*.sql' --include='*.toml' . ; then
            echo "::error::a Supabase personal access token is committed"; fail=1
          fi
          # service_role JWT (the legacy key format)
          if grep -rEn 'eyJhbGciOiJIUzI1NiI[A-Za-z0-9_.-]{40,}' --include='*.js' --include='*.html' --include='*.md' . ; then
            echo "::error::a JWT is committed"; fail=1
          fi
          # a literal assignment rather than process.env
          if grep -rEn "SERVICE_ROLE_KEY\s*=\s*['\"][A-Za-z0-9]" --include='*.js' . ; then
            echo "::error::a service role key is assigned literally"; fail=1
          fi
          exit $fail
