<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>label solver</title>
<link rel="stylesheet" href="style.css">
<style>body{margin:0;padding:12px;font:12px ui-monospace,monospace;background:#fff}#stage{width:430px}pre{white-space:pre-wrap}</style>
</head><body>
<pre id="out">solving…</pre>
<div id="stage"></div>
<script>
  const SB_URL='https://example.invalid', SB_KEY='k';
  window.Store = { mmGet: async () => null };
  window.toast = () => {};
  try { localStorage.clear(); } catch (_) {}
</script>
<script src="engine/interactive_map.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  Chooses each feature's label offset (lx / ly) by measurement instead of by
//  eye. Pin positions are geographic and fixed; only the caption moves.
//
//  A label is placed at [pin.x + lx, pin.y + ly] and is w x h px, so the offset
//  that puts a caption to the LEFT of its pin depends on that caption's own
//  width. That is why hand-tuned values drift as soon as a name changes.
//
//  Solved at ONE reference width (the offsets are absolute px, so there is no
//  width-independent answer) and then re-scored at a phone width to make sure
//  the result does not fall apart there.
// ═══════════════════════════════════════════════════════════════════════════
const ISLANDS = ['mauritius', 'rodrigues', 'world'];
// Target widths of the MAP BOX itself, not of the page: the card is a two-column
// grid, so the box is roughly half of whatever the stage is given. Solved at the
// desktop width, where the map is actually read, then re-scored narrower — a
// caption that merely crowds a neighbour on a phone is a much smaller problem
// than one clipped off the edge, and phones already ellipsise long captions.
const REF_BOX = 450;
const CHECK_BOXES = [330, 240];
const GAP = 9;              // clear space between pin and caption
const PAD = 2;              // keep captions this far inside the box

const stage = document.getElementById('stage');
const out = [];

function candidates(w, h) {
  const list = [];
  for (const d of [GAP, GAP + 12, GAP + 26]) {
    list.push({ lx: d,             ly: -Math.round(h/2), tag:'E'  });
    list.push({ lx: -(w + d),      ly: -Math.round(h/2), tag:'W'  });
    list.push({ lx: -Math.round(w/2), ly: -(h + d),      tag:'N'  });
    list.push({ lx: -Math.round(w/2), ly: d,             tag:'S'  });
    list.push({ lx: d,             ly: -(h + d),         tag:'NE' });
    list.push({ lx: -(w + d),      ly: -(h + d),         tag:'NW' });
    list.push({ lx: d,             ly: d,                tag:'SE' });
    list.push({ lx: -(w + d),      ly: d,                tag:'SW' });
  }
  return list;
}
const overlap = (a, b) =>
  Math.max(0, Math.min(a.x2,b.x2) - Math.max(a.x1,b.x1)) *
  Math.max(0, Math.min(a.y2,b.y2) - Math.max(a.y1,b.y1));

// Size the stage so the MAP BOX lands on the requested width. The relationship
// is linear (a fixed card padding plus a fractional grid column), so measure
// once and correct once.
function renderAtBox(island, targetBoxW) {
  let stageW = targetBoxW * 2;
  for (let i = 0; i < 3; i++) {
    stage.style.width = Math.round(stageW) + 'px';
    stage.__geo = null;
    GeoMap.render(stage, { island });
    // The map hides captions once it is crowded (GeoMap's LABEL_LIMIT), and a
    // display:none caption measures 0x0. Force them back on: the solver's whole
    // job is to size and place them.
    stage.querySelectorAll('.geo-markers').forEach(m => m.classList.remove('labels-quiet'));
    const w = stage.querySelector('.geo-map-wrap').getBoundingClientRect().width;
    if (Math.abs(w - targetBoxW) < 2) break;
    stageW += (targetBoxW - w) * 2;
  }
  stage.querySelectorAll('.geo-markers').forEach(m => m.classList.remove('labels-quiet'));
  return stage.querySelector('.geo-map-wrap').getBoundingClientRect();
}

function solve(island, boxW, only) {
  // Render once to measure each caption's real painted size.
  const wr = renderAtBox(island, boxW);
  const W = wr.width, H = wr.height;

  const items = [];
  stage.querySelectorAll('.geo-map-marker').forEach(btn => {
    if (only && !only.has(btn.dataset.featureId)) return;
    const lbl = btn.querySelector('.geo-marker-label');
    const lr = lbl.getBoundingClientRect(), br = btn.getBoundingClientRect();
    items.push({
      id: btn.dataset.featureId,
      px: br.left - wr.left, py: br.top - wr.top,
      w: Math.ceil(lr.width), h: Math.ceil(lr.height),
    });
  });

  const boxOf = (it, c) => ({ x1:it.px+c.lx, y1:it.py+c.ly, x2:it.px+c.lx+it.w, y2:it.py+c.ly+it.h });
  const score = (it, c, placed) => {
    const b = boxOf(it, c);
    let s = 0;
    // Off the edge is the worst outcome — a clipped caption is unreadable.
    const off = Math.max(0, PAD-b.x1) + Math.max(0, b.x2-(W-PAD)) + Math.max(0, PAD-b.y1) + Math.max(0, b.y2-(H-PAD));
    s += off * 260;
    for (const p of placed) if (p.id !== it.id) s += overlap(b, p.box) * 3;
    // Keep captions off every pin, not just the ones already placed.
    for (const o of items) {
      const pin = { x1:o.px-11, y1:o.py-11, x2:o.px+11, y2:o.py+11 };
      s += overlap(b, pin) * 6;
    }
    s += Math.hypot(c.lx + it.w/2, c.ly + it.h/2) * 0.9;   // prefer close captions
    return s;
  };

  // Greedy, then a few refinement passes now that every neighbour has a home.
  const chosen = new Map();
  const placed = [];
  const order = [...items].sort((a,b) => (b.w*b.h) - (a.w*a.h));
  for (const it of order) {
    let best = null;
    for (const c of candidates(it.w, it.h)) {
      const s = score(it, c, placed);
      if (!best || s < best.s) best = { s, c };
    }
    chosen.set(it.id, best.c);
    placed.push({ id:it.id, box:boxOf(it, best.c) });
  }
  for (let pass = 0; pass < 6; pass++) {
    for (const it of order) {
      const others = placed.filter(p => p.id !== it.id);
      let best = null;
      for (const c of candidates(it.w, it.h)) {
        const s = score(it, c, others);
        if (!best || s < best.s) best = { s, c };
      }
      chosen.set(it.id, best.c);
      const i = placed.findIndex(p => p.id === it.id);
      placed[i] = { id:it.id, box:boxOf(it, best.c) };
    }
  }

  // Report what the solution costs: clipped px and overlapping px.
  let clipped = 0, over = 0;
  for (const it of items) {
    const b = boxOf(it, chosen.get(it.id));
    clipped += Math.max(0, PAD-b.x1) + Math.max(0, b.x2-(W-PAD)) + Math.max(0, PAD-b.y1) + Math.max(0, b.y2-(H-PAD));
    for (const o of items) if (o.id !== it.id) over += overlap(b, boxOf(o, chosen.get(o.id))) / 2;
  }
  return { chosen, items, W, H, clipped, over };
}

// Re-score an existing solution at another width, to see it survive a phone.
function cost(island, boxW, chosen, only) {
  const r = solve(island, boxW, only);           // reuse its measurement pass only
  let clipped = 0, over = 0;
  const boxOf = (it, c) => ({ x1:it.px+c.lx, y1:it.py+c.ly, x2:it.px+c.lx+it.w, y2:it.py+c.ly+it.h });
  for (const it of r.items) {
    const c = chosen.get(it.id); if (!c) continue;
    const b = boxOf(it, c);
    clipped += Math.max(0, PAD-b.x1) + Math.max(0, b.x2-(r.W-PAD)) + Math.max(0, PAD-b.y1) + Math.max(0, b.y2-(r.H-PAD));
    for (const o of r.items) { const oc = chosen.get(o.id); if (!oc || o.id===it.id) continue; over += overlap(b, boxOf(o, oc))/2; }
  }
  return { clipped, over };
}

// ⚠ Solve PER CATEGORY, not per island. Past GeoMap's LABEL_LIMIT the map goes
// quiet and shows only the selected caption, so the only time a group of labels
// is on screen together is when its category filter is active. Solving all 58
// Mauritius captions against each other would optimise a view no child ever
// sees, and would compromise the views they do.
const answer = {};
for (const island of ISLANDS) {
  const rows = GeoMap.DEFAULTS.filter(f => (f.island || 'mauritius') === island);
  const cats = [...new Set(rows.map(f => f.type))].sort();
  out.push(`── ${island} ── ${rows.length} features in ${cats.length} categories`);
  for (const cat of cats) {
    const ids = new Set(rows.filter(f => f.type === cat).map(f => f.id));
    const current = new Map(rows.filter(f => ids.has(f.id))
      .map(f => [f.id, { lx:Number(f.lx ?? 16), ly:Number(f.ly ?? -22) }]));
    const was = cost(island, REF_BOX, current, ids);
    const r = solve(island, REF_BOX, ids);
    for (const [k, v] of r.chosen) answer[k] = [v.lx, v.ly];
    const phone = cost(island, CHECK_BOXES[0], r.chosen, ids);
    out.push(`   ${cat.padEnd(10)} ${String(ids.size).padStart(2)} labels · `
      + `was clipped ${Math.round(was.clipped)}px overlap ${Math.round(was.over)}px² · `
      + `now clipped ${Math.round(r.clipped)}px overlap ${Math.round(r.over)}px² · `
      + `at ${CHECK_BOXES[0]}px clipped ${Math.round(phone.clipped)}px overlap ${Math.round(phone.over)}px²`);
  }
  out.push('');
}
out.push(JSON.stringify(answer));
document.getElementById('out').textContent = out.join('\n');
document.title = 'done';
</script>
</body></html>
