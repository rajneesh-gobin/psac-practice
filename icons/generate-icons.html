<!DOCTYPE html>
<html>
<head><title>Generate PWA Icons</title></head>
<body>
<p>Generating icons... check your Downloads folder.</p>
<canvas id="c"></canvas>
<script>
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4338ca"/>
        <stop offset="52%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#c026d3"/>
      </linearGradient>
      <radialGradient id="glow" cx="30%" cy="22%" r="65%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="cap" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#dfe6ff"/>
      </linearGradient>
      <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fde68a"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
    </defs>
    <rect width="512" height="512" rx="115" fill="url(#bg)"/>
    <rect width="512" height="512" rx="115" fill="url(#glow)"/>
    <ellipse cx="256" cy="300" rx="118" ry="18" fill="#1e1b4b" opacity="0.18"/>
    <rect x="220" y="222" width="72" height="58" rx="13" fill="url(#cap)"/>
    <ellipse cx="256" cy="224" rx="120" ry="25" fill="url(#cap)"/>
    <polygon points="256,128 378,224 256,258 134,224" fill="#ffffff"/>
    <polygon points="256,128 378,224 356,232 256,152 156,232 134,224" fill="#eef2ff" opacity="0.7"/>
    <circle cx="256" cy="224" r="10" fill="url(#gold)"/>
    <path d="M256 224 C298 240 306 270 300 298" stroke="url(#gold)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="300" cy="304" r="15" fill="url(#gold)"/>
    <circle cx="356" cy="348" r="58" fill="#ffffff"/>
    <circle cx="356" cy="348" r="58" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <path transform="translate(356,348) scale(1.85)"
      d="M0,-26 6.47,-8.90 24.73,-8.03 10.46,3.40 15.28,21.03 0,11 -15.28,21.03 -10.46,3.40 -24.73,-8.03 -6.47,-8.90 Z"
      fill="url(#gold)"/>
  </svg>`;

  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url  = URL.createObjectURL(blob);
  const img  = new Image();
  img.onload = () => {
    [192, 512].forEach(size => {
      const c = document.getElementById('c');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(img, 0, 0, size, size);
      const a = document.createElement('a');
      a.download = `icon-${size}.png`;
      a.href = c.toDataURL('image/png');
      a.click();
    });
    document.querySelector('p').textContent = 'Done! Save icon-192.png and icon-512.png into the /icons/ folder.';
  };
  img.src = url;
</script>
</body>
</html>
