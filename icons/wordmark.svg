<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220">
  <!-- Icon + name lockup - for places with room for text (landing page header,
       README, social/share preview image). NOT used as the app/favicon icon
       itself: icons/icon.svg stays text-free on purpose, see the comment
       there. This reuses that icon's exact mark, scaled down, plus the name
       set in a plain system-font stack (no embedded/linked font, so it
       renders correctly anywhere this file is dropped in, no build step). -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="52%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
  </defs>

  <!-- Icon mark, scaled to a 180x180 tile -->
  <g transform="translate(20,20) scale(0.3516)">
    <rect width="512" height="512" rx="115" fill="url(#bg)"/>
    <rect width="512" height="512" rx="115" fill="url(#glow)"/>
    <ellipse cx="256" cy="300" rx="118" ry="18" fill="#1e1b4b" opacity="0.18"/>
    <rect x="220" y="222" width="72" height="58" rx="13" fill="url(#cap)"/>
    <ellipse cx="256" cy="224" rx="120" ry="25" fill="url(#cap)"/>
    <polygon points="256,128 378,224 256,258 134,224" fill="#ffffff"/>
    <polygon points="256,128 378,224 356,232 256,152 156,232 134,224" fill="#eef2ff" opacity="0.7"/>
    <circle cx="256" cy="224" r="10" fill="url(#gold)"/>
    <path d="M256 224 C298 240 306 270 300 298" stroke="url(#gold)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="300" cy="304" r="15" fill="url(#gold)"/>
    <circle cx="356" cy="348" r="58" fill="#ffffff"/>
    <circle cx="356" cy="348" r="58" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <path transform="translate(356,348) scale(1.85)"
      d="M0,-26 6.47,-8.90 24.73,-8.03 10.46,3.40 15.28,21.03 0,11 -15.28,21.03 -10.46,3.40 -24.73,-8.03 -6.47,-8.90 Z"
      fill="url(#gold)"/>
  </g>

  <!-- Wordmark -->
  <text x="228" y="118" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-size="72" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">PSAC</text>
  <text x="228" y="164" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-size="38" font-weight="600" fill="#475569">Question Simulator</text>
</svg>
