<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: used as the browser favicon, the iOS home-screen icon, and the
       Android "maskable" PWA icon (manifest.json marks it purpose="any
       maskable"). Maskable icons get cropped by the OS into a circle/squircle/
       rounded-square - only content inside a centered circle of ~80% of the
       icon's size is guaranteed to survive. Every meaningful shape below stays
       inside that circle (radius ~205 around the 256,256 center); only the
       full-bleed background rect is allowed to touch the edges. The old
       version's flag stripes sat almost entirely outside that circle and were
       being clipped on Android home screens without anyone noticing. No text
       here on purpose - a favicon renders as small as 16px and a home-screen
       icon a little larger, and a phrase like "PSAC Question Simulator" would
       be illegible (and get masked/cropped) at those sizes on every platform.
       See icons/wordmark.svg for the icon + name lockup, meant for contexts
       with room for both. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="52%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background - the only element allowed to touch the edges -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>

  <!-- Soft grounding shadow under the cap (no <filter> - plain opacity, so it
       renders identically everywhere a favicon/PWA icon does) -->
  <ellipse cx="256" cy="300" rx="118" ry="18" fill="#1e1b4b" opacity="0.18"/>

  <!-- Graduation cap -->
  <rect x="220" y="222" width="72" height="58" rx="13" fill="url(#cap)"/>
  <ellipse cx="256" cy="224" rx="120" ry="25" fill="url(#cap)"/>
  <polygon points="256,128 378,224 256,258 134,224" fill="#ffffff"/>
  <polygon points="256,128 378,224 356,232 256,152 156,232 134,224" fill="#eef2ff" opacity="0.7"/>

  <!-- Button + tassel -->
  <circle cx="256" cy="224" r="10" fill="url(#gold)"/>
  <path d="M256 224 C298 240 306 270 300 298" stroke="url(#gold)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="300" cy="304" r="15" fill="url(#gold)"/>

  <!-- Achievement star badge - echoes the ★ mastery rating used throughout the app -->
  <circle cx="356" cy="348" r="58" fill="#ffffff"/>
  <circle cx="356" cy="348" r="58" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <path transform="translate(356,348) scale(1.85)"
    d="M0,-26 6.47,-8.90 24.73,-8.03 10.46,3.40 15.28,21.03 0,11 -15.28,21.03 -10.46,3.40 -24.73,-8.03 -6.47,-8.90 Z"
    fill="url(#gold)"/>
</svg>
