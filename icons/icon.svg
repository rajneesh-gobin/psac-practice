<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Graduation cap hat brim -->
  <ellipse cx="256" cy="220" rx="150" ry="30" fill="white" opacity="0.95"/>
  <!-- Cap top -->
  <polygon points="256,100 406,220 256,250 106,220" fill="white" opacity="0.85"/>
  <!-- Tassel string -->
  <line x1="380" y1="220" x2="380" y2="310" stroke="white" stroke-width="6" opacity="0.9"/>
  <!-- Tassel end -->
  <circle cx="380" cy="318" r="14" fill="#fbbf24"/>
  <!-- Book icon below cap -->
  <rect x="186" y="300" width="140" height="110" rx="10" fill="white" opacity="0.2"/>
  <rect x="196" y="310" width="120" height="90" rx="8" fill="white" opacity="0.15"/>
  <!-- Book spine -->
  <rect x="249" y="300" width="14" height="110" fill="white" opacity="0.3"/>
  <!-- Lines on book -->
  <line x1="220" y1="335" x2="244" y2="335" stroke="white" stroke-width="4" opacity="0.6"/>
  <line x1="220" y1="350" x2="244" y2="350" stroke="white" stroke-width="4" opacity="0.6"/>
  <line x1="220" y1="365" x2="244" y2="365" stroke="white" stroke-width="4" opacity="0.6"/>
  <line x1="268" y1="335" x2="298" y2="335" stroke="white" stroke-width="4" opacity="0.6"/>
  <line x1="268" y1="350" x2="298" y2="350" stroke="white" stroke-width="4" opacity="0.6"/>
  <line x1="268" y1="365" x2="298" y2="365" stroke="white" stroke-width="4" opacity="0.6"/>
  <!-- Flag colours strip at bottom (Mauritius) -->
  <rect x="96" y="440" width="80" height="16" rx="4" fill="#e63946"/>
  <rect x="176" y="440" width="80" height="16" rx="4" fill="#457b9d"/>
  <rect x="256" y="440" width="80" height="16" rx="4" fill="#f4d35e"/>
  <rect x="336" y="440" width="80" height="16" rx="4" fill="#2d6a4f"/>
</svg>
